specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: GitHub Copilot
providerId: github-copilot
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - AI
  - Code Generation
  - Developer Tools
  - Coding Agent
  - IDE
description: GitHub Copilot is priced per seat across individual and organization plans, with included
  monthly premium request quotas and a metered overage rate. Free tier is gated by completion and premium
  request caps; Pro and Pro+ include unlimited completions plus per-tier premium request budgets. Business
  and Enterprise are seat-based at $19/seat/month and $39/seat/month respectively. Additional premium
  requests bill at $0.04 per request across all paid plans.
sources:
  - https://github.com/features/copilot/plans
  - https://docs.github.com/en/billing/concepts/product-billing/github-copilot
plans:
  - id: github-copilot-free
    name: Copilot Free
    type: freemium
    description: Free individual tier with 50 premium requests per month and 2,000 inline completions.
    entries:
      - label: Monthly subscription
        name: free_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
      - label: Premium requests
        name: premium_requests
        type: quota
        metric: request
        limit: 50
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Inline completions
        name: completions
        type: quota
        metric: completion
        limit: 2000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Agent mode requests
        name: agent_mode
        type: quota
        metric: request
        limit: 50
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Access to Haiku 4.5, GPT-5 mini, and select models
      - name: Limited completions
      - name: GitHub Copilot Chat
  - id: github-copilot-pro
    name: Copilot Pro
    type: subscription
    description: Individual paid tier — 300 premium requests/month, unlimited completions, unlimited agent
      mode.
    entries:
      - label: Per-user monthly subscription
        name: pro_monthly
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '10.00'
        userMultiplied: true
      - label: Premium requests
        name: premium_requests
        type: quota
        metric: request
        limit: 300
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Premium request overage
        name: premium_overage
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.04'
        userMultiplied: false
    elements:
      - name: Unlimited inline completions
      - name: Unlimited agent mode
      - name: Code review
      - name: Cloud agent capabilities
      - name: GitHub Copilot Chat
      - name: GitHub MCP Server access
  - id: github-copilot-pro-plus
    name: Copilot Pro+
    type: subscription
    description: Top individual tier — 1,500 premium requests/month plus access to all premium models
      including Claude Opus.
    entries:
      - label: Per-user monthly subscription
        name: pro_plus_monthly
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '39.00'
        userMultiplied: true
      - label: Premium requests
        name: premium_requests
        type: quota
        metric: request
        limit: 1500
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Premium request overage
        name: premium_overage
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.04'
        userMultiplied: false
    elements:
      - name: Access to all premium models including Claude Opus 4.7
      - name: Unlimited completions
      - name: Unlimited agent mode
      - name: Code review and cloud agent
      - name: Priority access during high load
  - id: github-copilot-business
    name: Copilot Business
    type: subscription
    description: Organization tier — $19 per seat per month with license management, policy controls,
      and IP indemnity.
    entries:
      - label: Per-seat monthly subscription
        name: business_monthly
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '19.00'
        userMultiplied: true
      - label: Premium request overage
        name: premium_overage
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.04'
        userMultiplied: false
    elements:
      - name: Org-wide license management
      - name: Policy controls and content exclusion
      - name: IP indemnity
      - name: Audit logs
      - name: GitHub Copilot for Business API
      - name: Usage metrics API
  - id: github-copilot-enterprise
    name: Copilot Enterprise
    type: subscription
    description: Top organization tier — $39 per seat per month, includes Business features plus knowledge
      bases, custom models, and code-base aware chat.
    entries:
      - label: Per-seat monthly subscription
        name: enterprise_monthly
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '39.00'
        userMultiplied: true
      - label: Premium request overage
        name: premium_overage
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.04'
        userMultiplied: false
    elements:
      - name: Knowledge bases
      - name: Code-base aware chat
      - name: Pull request summaries
      - name: Fine-tuned models (where available)
      - name: Enterprise audit and security controls
      - name: GitHub Copilot Enterprise APIs
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: http://apievangelist.com
