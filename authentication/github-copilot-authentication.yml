token_types:
- Personal access token (classic) — Authorization bearer; carries OAuth scopes (see scopes/github-copilot-scopes.yml).
- Fine-grained personal access token — uses org "GitHub Copilot Business" (read) and "Administration" permissions.
- OAuth app token / GitHub App installation token — Authorization bearer.
notes: >-
