  - type: Features
    data:
      - name: Code Completion
        description: AI-powered inline code suggestions that complete lines, functions, and entire blocks as you type in your IDE.
      - name: Chat
        description: >-
          Conversational AI assistant for asking questions about code, generating solutions, and debugging directly in
          your editor.
      - name: Coding Agent
        description: >-
          Autonomous agent that explores code, makes changes, runs tests, and opens pull requests from issue
          assignments.
      - name: Code Review
        description: >-
          AI-powered pull request review that analyzes changes, identifies issues, and suggests fixes across any
          language.
      - name: Extensions
        description: Third-party integrations that extend Copilot Chat with custom tools, services, and domain-specific agents.
      - name: Custom Instructions
        description: Repository-level and organization-level configuration to guide Copilot behavior, code style, and conventions.
      - name: MCP Server
        description: >-
          Model Context Protocol server enabling AI tools to interact with GitHub repositories, issues, and pull
          requests.
      - name: Content Exclusion
        description: >-
          Governance controls to specify which files and repositories Copilot can access at organization and enterprise
          level.
      - name: Usage Metrics
        description: >-
          Detailed analytics on Copilot adoption, usage patterns, and productivity impact across organizations and
          enterprises.
      - name: Seat Management
        description: >-
          Programmatic management of Copilot seat assignments, billing, and subscription details for organizations and
          teams.
  - type: UseCases
    data:
      - name: Developer Productivity
        description: Accelerate software development with AI-powered code completions, chat assistance, and automated code review.
      - name: Enterprise Copilot Governance
        description: >-
          Manage Copilot deployments at scale with seat management, content exclusion, usage metrics, and compliance
          controls.
      - name: Custom AI Tooling
        description: >-
          Build domain-specific Copilot Extensions and agents that integrate third-party tools and services into the
          developer workflow.
      - name: Code Quality Automation
        description: >-
          Automate code review, identify potential issues, and enforce coding standards using the Copilot Code Review
          agent.
  - type: Integrations
    data:
      - name: Visual Studio Code
        description: Full Copilot integration in VS Code including code completion, chat, code review, and MCP support.
      - name: JetBrains IDEs
        description: Copilot code completion and chat support across IntelliJ, PyCharm, WebStorm, and other JetBrains IDEs.
      - name: GitHub.com
        description: Copilot Chat, code review, and coding agent capabilities directly in the GitHub web interface.
      - name: GitHub Actions
        description: Copilot coding agent uses GitHub Actions to spin up secure environments for autonomous coding tasks.
      - name: Model Context Protocol
        description: Standard protocol integration enabling AI tools to access GitHub data through the official MCP server.
  - type: LlmsText
    url: https://docs.github.com/llms.txt
